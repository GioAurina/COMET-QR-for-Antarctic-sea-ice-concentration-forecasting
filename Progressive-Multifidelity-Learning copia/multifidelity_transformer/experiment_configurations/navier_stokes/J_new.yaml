---
experiment_name: "J_new"

data:
  path: "/Users/pconti/Desktop/MultiFidelity/data/navierstokes"
  sequential_mask: False
  scaling: "SV + Reynolds"
  seq_len: 60
  seq_freq: 10
  dimensions:
    level_0: 2
    level_1: 2
    level_2: 20
    level_3: 577
    output: 32
  parameters_dim : 2

model:
  checkpoints_path: "/checkpoints"
  spatial_encoders_dim:
    level_2: 16
    level_3: 32
  load_model: False
  save_model: False
  embedding_dim: 32
  n_heads: 2
  mask_embeddings: False
  n_transformer_blocks: 3
  dropout: 0.1

logging:
  wandb: False
  gradients: False
  save_model: False

training:
  epochs: 200
  batch_size: 128
  optim_params:
    learning_rate: 0.5
    warmup: 400
    betas:
      - 0.9
      - 0.98
    eps: 1e-9
    weight_decay: 1e-4
