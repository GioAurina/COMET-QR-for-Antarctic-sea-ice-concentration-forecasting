---
experiment_name: "I_new_scaling"

data:
  path: "/Users/marcodamommio/Progressive-Multifidelity-Learning/NS_data"
  sequential_mask: True
  scaling: "SV + Reynolds"
  seq_len: 60
  seq_freq: 10
  dimensions:
    level_0: 2
    level_1: 2
    level_2: 20
    level_3: 577
    output: 32

model:
  checkpoints_path: "/Users/marcodamommio/Progressive-Multifidelity-Learning/checkpoints"
  load_model: False
  save_model: True
  embedding_dim: 64
  n_heads: 1
  mask_embeddings: False
  n_transformer_blocks: 1

logging:
  wandb: False
  gradients: False
  save_model: False

training:
  epochs: 200
  batch_size: 64
  optim_params:
    learning_rate: 0.5
    warmup: 400
    betas:
      - 0.9
      - 0.98
    eps: 1e-9
    weight_decay: 1e-4
